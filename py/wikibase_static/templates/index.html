{% extends "base.html" %}
{% block main %}
<article class="index">
  <h1>{{ site_title }}</h1>
  {% if site_description %}
  <p class="description">{{ site_description }}</p>
  {% endif %}
  <p class="muted">{{ ui_counts }}</p>
  <ul class="page-links">
    {% for link in page_links %}
    <li><a href="{{ link.href }}">{{ link.title }}</a> <span class="muted">{{ link.note }}</span></li>
    {% endfor %}
  </ul>
</article>
{% endblock %}
