[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikibase-static"
dynamic = ["version"]
description = "Static, read-only HTML demonstrators for Wikibase instances"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Florian Thiery" }]
dependencies = ["PyYAML>=6", "Jinja2>=3.1", "rdflib>=7"]

[project.urls]
Repository = "https://github.com/n4o-rse/wikibase-static"

[tool.setuptools.dynamic]
version = { attr = "wikibase_static.__version__" }

[tool.setuptools.packages.find]
where = ["py"]

# Without this, `pip install` ships the code but not the page templates and assets,
# and the build step of a site repository finds nothing to render with.
[tool.setuptools.package-data]
wikibase_static = ["templates/*.html", "data/*.yaml", "data/*.ttl", "data/kernel/*.csv", "static/*", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]
