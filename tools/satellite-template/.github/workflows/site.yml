# Checks the committed site and publishes docs/ to GitHub Pages. The logic is in the reusable workflow of wikibase-static
# (PRIMER.md there, S8): the command below twice, the working tree must be clean after each run (so docs/ is what a fresh
# build makes), a dead internal link makes the run red; only then the deploy job publishes docs/.
#
# Once per repository, BEFORE the first push: Settings -> Pages -> Source: "GitHub Actions".

name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  site:
    uses: n4o-rse/wikibase-static/.github/workflows/site.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      command: python main.py --strict
      deploy: true
